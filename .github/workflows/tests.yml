name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy pandas scipy scikit-learn matplotlib joblib pytest
      - name: Check dataset
        run: bash scripts/bash/02_check_data.sh
      - name: Unit tests
        run: pytest
      - name: Quick pipeline run
        run: python scripts/quick_test.py --fast
